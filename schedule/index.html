<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบจัดตารางเวร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../shared/auth.js"></script>
<style>
  :root{
    --bg:#F5F6F1; --card:#FFFFFF; --ink:#1E2A22; --ink-soft:#5B6B60; --ink-faint:#93A398; --line:#DDE3D8;
    --accent:#3B4FA0; --accent-tint:#E8EAF6;
    --amber:#BA7517; --amber-tint:#FAEEDA;
    --red:#A32D2D; --red-tint:#FCEBEB;
    --green:#3B6D11; --green-tint:#EAF3DE;
    --gray-tint:#EDEDE8; --gray-ink:#5F5E5A;
    --radius:14px; --shadow:0 1px 2px rgba(30,42,34,.06), 0 4px 16px rgba(30,42,34,.05);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Sarabun','Inter',sans-serif; -webkit-font-smoothing:antialiased;}
  .app{max-width:1080px; margin:0 auto; padding:0 20px 80px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:14px; padding-top:14px;}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{width:44px; height:44px; border-radius:12px; background:var(--accent); display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;}
  .brand-mark svg{width:22px; height:22px;}
  .brand h1{font-size:19px; font-weight:600; margin:0; line-height:1.3;}
  .brand p{margin:0; font-size:13px; color:var(--ink-soft);}
  .topbar-right{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-soft);}
  .topbar-right a{color:var(--red); cursor:pointer; text-decoration:underline;}
  .icon{width:16px; height:16px; vertical-align:-3px; flex-shrink:0;}
  .icon-sm{width:14px; height:14px; vertical-align:-2px; flex-shrink:0;}

  .tabs{display:flex; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px; width:fit-content; margin-bottom:20px; flex-wrap:wrap;}
  .tab-btn{border:none; background:transparent; padding:9px 16px; border-radius:999px; font-size:14px; font-family:inherit; font-weight:500; color:var(--ink-soft); cursor:pointer; transition:.15s; display:flex; align-items:center; gap:6px;}
  .tab-btn.active{background:var(--accent); color:#fff;}
  .panel{display:none;}
  .panel.active{display:block;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px; margin-bottom:20px;}
  .card h2{font-size:16px; margin:0 0 18px; display:flex; align-items:center; gap:8px;}

  .month-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;}
  .month-nav .label{font-size:19px; font-weight:700;}
  .month-nav-btns{display:flex; gap:8px;}
  .nav-btn{border:1px solid var(--line); background:#fff; border-radius:9px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);}
  .nav-btn:hover{border-color:var(--accent); color:var(--accent);}

  .day-row{display:flex; align-items:center; gap:14px; padding:12px 16px; border-bottom:1px solid var(--line);}
  .day-row:last-child{border-bottom:none;}
  .day-date{width:70px; flex-shrink:0; font-size:13.5px;}
  .day-date b{display:block; font-size:16px;}
  .day-badge{font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:999px; margin-top:2px; display:inline-block;}
  .badge-holiday{background:var(--amber-tint); color:var(--amber);}
  .badge-festival{background:var(--red-tint); color:var(--red);}
  .day-slots{flex:1; display:flex; gap:10px; flex-wrap:wrap;}
  .slot{flex:1; min-width:160px;}
  .slot label{display:block; font-size:11px; color:var(--ink-faint); margin-bottom:3px;}
  .slot select{width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:13.5px; background:#fff; color:var(--ink);}
  .slot select:focus{border-color:var(--accent); outline:none;}
  .save-indicator{font-size:11px; color:var(--green); width:60px; text-align:right; flex-shrink:0;}

  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-dow{text-align:center; font-size:12px; font-weight:700; color:var(--ink-faint); padding:6px 0;}
  .cal-cell{border:1px solid var(--line); border-radius:9px; min-height:90px; padding:6px; font-size:11.5px; background:#fff;}
  .cal-cell.empty{background:transparent; border:none;}
  .cal-cell.holiday{background:var(--amber-tint); border-color:#EBD8B4;}
  .cal-cell.festival{background:var(--red-tint); border-color:#F3D9D9;}
  .cal-daynum{font-weight:700; font-size:13px; margin-bottom:4px;}
  .cal-name{display:block; margin-bottom:2px; line-height:1.35; padding:1px 4px; border-radius:4px; background:rgba(255,255,255,.6);}
  .cal-name.morning{color:var(--accent);}
  .cal-name.evening{color:var(--ink-soft);}
  .cal-name{cursor:pointer;}
  .cal-name:hover{text-decoration:underline;}
  .cal-name.swap-offered{background:#FFF6D6; color:#8A6D00; font-weight:600;}
  .cal-name.swap-matched{background:#FDE7CF; color:#A0530A; font-weight:600;}
  .cal-name.swap-confirmed{color:var(--green); font-weight:700;}
  .swap-orig{display:block; font-size:9.5px; color:var(--ink-faint); font-weight:400; text-decoration:line-through;}
  .cal-daynum{display:flex; align-items:center; justify-content:space-between; gap:4px;}
  .cal-edit-btn{border:none; background:none; color:var(--ink-faint); cursor:pointer; font-size:12px; padding:0 2px;}
  .cal-edit-btn:hover{color:var(--accent);}

  .modal-overlay{display:none; position:fixed; inset:0; background:rgba(20,28,22,.5); z-index:100; align-items:flex-start; justify-content:center; padding:32px 16px; overflow-y:auto;}
  .modal-overlay.active{display:flex;}
  .modal{background:#fff; border-radius:16px; max-width:480px; width:100%; padding:26px; box-shadow:0 20px 50px rgba(20,28,22,.25);}
  .modal h3{margin:0 0 14px; font-size:17px;}
  .modal-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;}

  .btn{border:none; border-radius:10px; padding:11px 20px; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:7px;}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:hover{background:#2e3d80;}
  .btn-primary:disabled{opacity:.55; cursor:not-allowed;}
  .btn-outline{background:#fff; border:1px solid var(--line); color:var(--ink-soft);}
  .btn-outline:hover{border-color:var(--accent); color:var(--accent);}
  .btn-danger-outline{background:#fff; border:1px solid var(--line); color:var(--red);}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; font-weight:500; color:var(--ink-soft); margin-bottom:6px;}
  .field input{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:9px; font-family:inherit; font-size:14px; background:#fff; color:var(--ink);}
  .field-row{display:flex; gap:12px; flex-wrap:wrap;}
  .field-row .field{flex:1; min-width:160px;}

  .list-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .list-row:last-child{border-bottom:none;}
  .empty{padding:30px 20px; text-align:center; color:var(--ink-faint); font-size:14px;}
  .no-access{padding:60px 20px; text-align:center; color:var(--ink-faint);}

  @media (max-width:700px){
    .day-row{flex-wrap:wrap;}
    .day-slots{width:100%;}
    .cal-grid{grid-template-columns:repeat(7,minmax(0,1fr)); font-size:10px;}
    .cal-cell{min-height:64px; padding:3px;}
  }
</style>
</head>
<body>
<div style="padding:14px 20px 0; max-width:1080px; margin:0 auto;">
  <a href="../" style="display:inline-flex; align-items:center; gap:6px; font-family:'Sarabun',sans-serif; font-size:13px; font-weight:600; color:#3B4FA0; text-decoration:none;">← หน้ารวมเครื่องมือ</a>
</div>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg></div>
      <div><h1>ระบบจัดตารางเวร</h1><p>ห้องยา · โรงพยาบาลเชียงม่วน</p></div>
    </div>
    <div class="topbar-right" id="whoami"></div>
  </div>

  <div class="tabs" id="tabsWrap">
    <button class="tab-btn active" data-tab="calendar">ปฏิทินเวร</button>
    <button class="tab-btn" data-tab="build">จัดตารางเวร</button>
    <button class="tab-btn" data-tab="requests">ขอหยุด/ขออยู่เวร</button>
    <button class="tab-btn" data-tab="settings">วันหยุด/เทศกาล</button>
    <button class="tab-btn" data-tab="reports">รายงานเบิกค่าเวร</button>
  </div>

  <div class="panel active" id="panel-calendar"></div>
  <div class="panel" id="panel-build"></div>
  <div class="panel" id="panel-requests"></div>
  <div class="panel" id="panel-settings"></div>
  <div class="panel" id="panel-reports"></div>

  <div class="modal-overlay" id="actionOverlay"><div class="modal" id="actionModalBox"></div></div>
  <div class="modal-overlay" id="dayEditOverlay"><div class="modal" id="dayEditModalBox"></div></div>

</div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwxiTiv0pi9inZNK8GryA07Lm4CmLPa0MxJQH0KaP_Jk7RSgMUgQrkc1WuOp8C1nWuyhw/exec';

window.PHQAuth.requireAuth();
function renderWhoami(name){
  document.getElementById('whoami').innerHTML = `ผู้ใช้งาน: <b>${name}</b> &nbsp;·&nbsp; <a id="phq-logout">ออกจากระบบ</a>`;
  document.getElementById('phq-logout').addEventListener('click', ()=>{ window.PHQAuth.clearAuth(); location.reload(); });
}

const THAI_MONTHS = ['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const THAI_DOW = ['อา','จ','อ','พ','พฤ','ศ','ส'];

let canManage = false;
let myPosition = '';
let staffList = [];
let curYear, curMonth; // curMonth: 1-12
let monthShifts = [];
let monthDayInfo = [];
let holidays = [];
let festivals = [];
let monthRequests = [];

function apiCall(action, extra){
  return fetch(API_URL, { method:'POST', body: JSON.stringify(Object.assign({action}, extra||{})) }).then(r=>r.json());
}
function showLoadError_(msg){
  const activeTab = document.querySelector('.tab-btn.active').dataset.tab;
  const wrap = document.getElementById('panel-'+activeTab);
  if(wrap) wrap.innerHTML = `<div class="card"><div class="no-access" style="color:var(--red);">⚠️ ${msg}</div></div>`;
}

// ---------- Tabs ----------
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab==='calendar') renderCalendarPanel();
    if(btn.dataset.tab==='build') renderBuildPanel();
    if(btn.dataset.tab==='settings') renderSettingsPanel();
    if(btn.dataset.tab==='requests') renderRequestsPanel();
    if(btn.dataset.tab==='reports') renderReportsPanel();
  });
});

function initMonth(){
  const now = new Date();
  curYear = now.getFullYear();
  curMonth = now.getMonth()+1;
}
initMonth();

function monthLabel(){ return THAI_MONTHS[curMonth] + ' ' + (curYear+543); }
function changeMonth(delta){
  curMonth += delta;
  if(curMonth>12){ curMonth=1; curYear++; }
  if(curMonth<1){ curMonth=12; curYear--; }
  loadMonthAndRender();
}

async function loadMonthAndRender(){
  let data;
  try{
    data = await apiCall('getMonth', {year:curYear, month:curMonth});
  }catch(e){
    showLoadError_('โหลดตารางเวรไม่สำเร็จ (เชื่อมต่อ Apps Script ไม่ได้): '+e.message);
    return;
  }
  if(!data.ok){ showLoadError_('โหลดตารางเวรไม่สำเร็จ: '+(data.error||'unknown')); return; }
  monthShifts = data.shifts;
  monthDayInfo = data.dayInfo;
  monthRequests = data.requests || [];
  const activeTab = document.querySelector('.tab-btn.active').dataset.tab;
  if(activeTab==='build') renderBuildPanel();
  if(activeTab==='calendar') renderCalendarPanel();
}

// คืนคำขอ (ถ้ามี) ของรหัสพนักงานคนหนึ่งที่ครอบคลุมวันที่ระบุ
function requestFor(code, date){
  return monthRequests.find(r => r.code===code && date>=r.startDate && date<=r.endDate);
}

function shiftFor(date, slotType){
  return monthShifts.find(s=>s.date===date && s.slotType===slotType);
}
function dayInfoFor(date){
  return monthDayInfo.find(d=>d.date===date);
}

// ---------- แท็บ 1: จัดตารางเวร ----------
function renderBuildPanel(){
  const wrap = document.getElementById('panel-build');
  if(!canManage){
    wrap.innerHTML = `<div class="card"><div class="no-access">เฉพาะผู้มีหน้าที่จัดตารางเวรเท่านั้นที่เข้าหน้านี้ได้ครับ<br>ดูตารางเวรได้ที่แท็บ "ปฏิทินเวร"</div></div>`;
    return;
  }
  const pharmacists = staffList.filter(s=>s.position==='pharmacist');
  const technicians = staffList.filter(s=>s.position==='technician');

  let rowsHtml = '';
  monthDayInfo.forEach(d=>{
    const dt = new Date(d.date+'T00:00:00');
    const dayNum = dt.getDate();
    const dow = THAI_DOW[dt.getDay()];
    const badges = (d.isHoliday?'<span class="day-badge badge-holiday">วันหยุด</span>':'') + (d.isFestival?' <span class="day-badge badge-festival">เทศกาล</span>':'');

    let slotsHtml = '';
    if(d.isHoliday){
      const mp = shiftFor(d.date,'morning-pharmacist');
      const mt = shiftFor(d.date,'morning-technician');
      slotsHtml += slotSelectHtml(d.date,'morning-pharmacist','เช้า (เภสัชกร)', pharmacists, mp?mp.actualCode:'');
      slotsHtml += slotSelectHtml(d.date,'morning-technician','เช้า (จนท.)', technicians, mt?mt.actualCode:'');
    }
    const et = shiftFor(d.date,'evening-technician');
    slotsHtml += slotSelectHtml(d.date,'evening-technician','บ่าย (จนท.)', technicians, et?et.actualCode:'');

    rowsHtml += `
      <div class="day-row" data-date="${d.date}">
        <div class="day-date"><b>${dayNum}</b>${dow} ${badges}</div>
        <div class="day-slots">${slotsHtml}</div>
      </div>`;
  });

  wrap.innerHTML = `
    <div class="card">
      <div class="month-nav">
        <button class="nav-btn" id="prevMonth"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
        <div class="label">${monthLabel()}</div>
        <button class="nav-btn" id="nextMonth"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
      <p style="font-size:12.5px; color:var(--ink-soft); background:var(--accent-tint); padding:10px 14px; border-radius:9px; margin-bottom:16px;">💡 เลือกชื่อได้อิสระทุกวันก่อน ระบบจะ<b>ยังไม่บันทึก</b>จนกว่าจะกดปุ่ม "บันทึกตารางเวรทั้งเดือน" ด้านล่างสุด เพื่อให้ทบทวนได้ครบก่อนยืนยัน</p>
      ${rowsHtml}
      <div style="margin-top:18px; display:flex; align-items:center; gap:14px;">
        <button class="btn btn-primary" id="btnSaveMonth">บันทึกตารางเวรทั้งเดือน</button>
        <span id="saveMonthStatus" style="font-size:13px; color:var(--green);"></span>
      </div>
    </div>
    <div class="card">
      <h2><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg> ส่งออกตารางเซ็นชื่อ</h2>
      <p style="font-size:13px; color:var(--ink-soft); margin-top:0;">ดาวน์โหลดเป็นไฟล์ Excel พร้อมพิมพ์ให้เจ้าหน้าที่เซ็นชื่อ (จัดหน้าและฟอนต์ TH Sarabun New ให้อัตโนมัติ) — ควรกด "บันทึกตารางเวรทั้งเดือน" ก่อนส่งออก เพื่อให้ไฟล์ตรงกับที่จัดล่าสุด</p>
      <button class="btn btn-primary" id="btnExport">ดาวน์โหลด Excel</button>
    </div>`;

  document.getElementById('prevMonth').addEventListener('click', ()=>changeMonth(-1));
  document.getElementById('nextMonth').addEventListener('click', ()=>changeMonth(1));
  document.getElementById('btnExport').addEventListener('click', doExport);
  document.getElementById('btnSaveMonth').addEventListener('click', saveMonthDraft);
}

function slotSelectHtml(date, slotType, label, options, selectedCode){
  return `
    <div class="slot">
      <label>${label}</label>
      <select data-date="${date}" data-slot="${slotType}">
        <option value="">— ยังไม่กำหนด —</option>
        ${options.map(o=>{
          const req = requestFor(o.code, date);
          let tag = '';
          if(req) tag = req.type==='unavailable' ? ' ⚠️ ขอไม่อยู่เวร' : ' ✓ ขออยู่เวร';
          return `<option value="${o.code}" ${o.code===selectedCode?'selected':''}>${o.name}${tag}</option>`;
        }).join('')}
      </select>
    </div>`;
}

async function saveMonthDraft(){
  const wrap = document.getElementById('panel-build');
  const assignments = [];
  wrap.querySelectorAll('select').forEach(sel=>{
    assignments.push({ date: sel.dataset.date, slotType: sel.dataset.slot, code: sel.value });
  });
  const filled = assignments.filter(a=>a.code).length;
  if(!confirm(`ยืนยันบันทึกตารางเวรเดือน ${monthLabel()}?\nมีทั้งหมด ${filled} ช่องที่กำหนดชื่อไว้แล้ว\n(กด ตกลง เพื่อบันทึกจริงลง Google Sheet)`)) return;

  const btn = document.getElementById('btnSaveMonth');
  const status = document.getElementById('saveMonthStatus');
  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
  try{
    const res = await apiCall('saveMonthBulk', {year:curYear, month:curMonth, assignments});
    if(!res.ok) throw new Error(res.error||'unknown');
    status.textContent = `บันทึกสำเร็จ ${res.saved} รายการ ✓`;
    if(res.errors && res.errors.length) status.textContent += ' (มีบางรายการผิดพลาด: '+res.errors.join(', ')+')';
    await loadMonthAndRender();
  }catch(e){
    alert('บันทึกไม่สำเร็จ: '+e.message);
  }
  btn.disabled = false; btn.textContent = 'บันทึกตารางเวรทั้งเดือน';
}

async function doExport(){
  const btn = document.getElementById('btnExport');
  btn.disabled = true; btn.textContent = 'กำลังสร้างไฟล์...';
  try{
    const res = await apiCall('exportMonthXlsx', {year:curYear, month:curMonth});
    if(!res.ok) throw new Error(res.error||'unknown');
    const bytes = atob(res.base64);
    const arr = new Uint8Array(bytes.length);
    for(let i=0;i<bytes.length;i++) arr[i] = bytes.charCodeAt(i);
    const blob = new Blob([arr], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = res.filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(e){
    alert('สร้างไฟล์ไม่สำเร็จ: '+e.message);
  }
  btn.disabled = false; btn.textContent = 'ดาวน์โหลด Excel';
}

// ---------- แท็บ 2: ปฏิทินเวร ----------
function cellNameHtml(shift){
  if(!shift) return '';
  const swapped = shift.actualCode !== shift.originalCode;
  if(shift.swapStatus === 'offered'){
    let note = {}; try{ note = JSON.parse(shift.swapNote||'{}'); }catch(e){}
    const tag = note.offerType==='sell' ? '🏷️' : '🔁';
    return `<span class="cal-name swap-offered" data-date="${shift.date}" data-slot="${shift.slotType}">${tag} ${shift.actualName}</span>`;
  }
  if(shift.swapStatus === 'matched'){
    let note = {}; try{ note = JSON.parse(shift.swapNote||'{}'); }catch(e){}
    const partner = note.partnerDate ? shiftFor(note.partnerDate, note.partnerSlotType) : null;
    const previewName = partner ? partner.originalName : shift.actualName;
    return `<span class="cal-name swap-matched" data-date="${shift.date}" data-slot="${shift.slotType}">🔁 ${previewName}</span>`;
  }
  if(shift.swapStatus === 'confirmed' && swapped){
    return `<span class="cal-name swap-confirmed" data-date="${shift.date}" data-slot="${shift.slotType}">${shift.actualName}<span class="swap-orig">✕ ${shift.originalName}</span></span>`;
  }
  return `<span class="cal-name" data-date="${shift.date}" data-slot="${shift.slotType}">${shift.actualName}</span>`;
}

  }

      <p style="font-size:13px; color:var(--ink-soft); margin-top:0;">ขอได้ล่วงหน้าไม่จำกัด (แม้ข้ามปี) เพื่อให้ผู้จัดเวรเห็นตอนจัดตารางเดือนถัดไป</p>

        <div class="field"><label>วันสิ้นสุด</label><input type="date" id="reqEnd"></div>

// ---------- Modal: จัดการเวร (แลก/ขาย/ยืนยัน) ----------
function closeActionModal(){ document.getElementById('actionOverlay').classList.remove('active'); }
function closeDayEditModal(){ document.getElementById('dayEditOverlay').classList.remove('active'); }
document.getElementById('actionOverlay').addEventListener('click', e=>{ if(e.target.id==='actionOverlay') closeActionModal(); });
document.getElementById('dayEditOverlay').addEventListener('click', e=>{ if(e.target.id==='dayEditOverlay') closeDayEditModal(); });

function openShiftActionModal(date, slotType){
  const shift = shiftFor(date, slotType);
  if(!shift) return;
  const auth = window.PHQAuth.getAuth();
  if(!auth) return;
  const myCode = String(auth.code).trim();
  const box = document.getElementById('actionModalBox');
  const slotLabel = slotType==='morning-pharmacist' ? 'เช้า (เภสัชกร)' : slotType==='morning-technician' ? 'เช้า (จนท.)' : 'บ่าย (จนท.)';
  let bodyHtml = `<div style="font-size:13.5px; color:var(--ink-soft); margin-bottom:14px;">📅 ${date} · ${slotLabel}<br>ผู้ปฏิบัติงาน: <b>${shift.actualName}</b></div>`;
  let actionsHtml = '';

  if(shift.swapStatus === 'none'){
    if(myCode === shift.actualCode){
      actionsHtml = `<button class="btn btn-outline" id="btnOfferSwap">🔁 เสนอแลกเวรนี้</button>
        <button class="btn btn-outline" id="btnOfferSell">🏷️ เสนอขายเวรนี้</button>`;
    }else{
      bodyHtml += `<p style="font-size:13px; color:var(--ink-faint);">เวรนี้ยังไม่มีการเสนอแลก/ขาย</p>`;
    }
  }else if(shift.swapStatus === 'offered'){
    let note = {}; try{ note = JSON.parse(shift.swapNote||'{}'); }catch(e){}
    if(myCode === shift.actualCode){
      bodyHtml += `<p style="font-size:13px; color:#8A6D00;">คุณเสนอ${note.offerType==='sell'?'ขาย':'แลก'}เวรนี้ไว้ รอผู้รับ</p>`;
      actionsHtml = `<button class="btn btn-danger-outline" id="btnCancelOffer">ยกเลิกการเสนอ</button>`;
    }else if(note.offerType === 'sell'){
      bodyHtml += `<p style="font-size:13px; color:#8A6D00;">🏷️ เสนอขายเวรนี้ ต้องการรับซื้อไหม</p>`;
      actionsHtml = `<button class="btn btn-primary" id="btnAcceptSell">รับซื้อเวรนี้</button>`;
    }else{
      const myOffers = monthShifts.filter(s=> String(s.actualCode).trim()===myCode && s.swapStatus==='offered');
      const myOfferSwaps = myOffers.filter(s=>{ let n={}; try{n=JSON.parse(s.swapNote||'{}');}catch(e){} return n.offerType==='swap'; });
      if(myOfferSwaps.length){
        bodyHtml += `<p style="font-size:13px; color:#8A6D00;">🔁 เสนอแลกเวรนี้ไว้ เลือกเวรของคุณที่จะใช้แลก:</p>`;
        actionsHtml = myOfferSwaps.map(s=>`<button class="btn btn-outline btn-match" data-src-date="${s.date}" data-src-slot="${s.slotType}">แลกกับเวรวันที่ ${s.date}</button>`).join('');
      }else{
        bodyHtml += `<p style="font-size:13px; color:var(--ink-faint);">🔁 เสนอแลกเวรนี้ไว้ — คุณต้องมีเวรของตัวเองที่เสนอแลกไว้ก่อน (ไปที่เวรของคุณ กด "เสนอแลกเวรนี้" ก่อน แล้วค่อยกลับมาจับคู่ที่นี่)</p>`;
      }
    }
  }else if(shift.swapStatus === 'matched'){
    let note = {}; try{ note = JSON.parse(shift.swapNote||'{}'); }catch(e){}
    const partner = note.partnerDate ? shiftFor(note.partnerDate, note.partnerSlotType) : null;
    bodyHtml += `<p style="font-size:13px; color:#A0530A;">🔁 จับคู่แลกกับ ${partner?partner.originalName:'-'} (วันที่ ${note.partnerDate||'-'}) รอยืนยัน</p>`;
    if(myCode === shift.actualCode){
      actionsHtml = `<button class="btn btn-primary" id="btnConfirmSwap">ยืนยันแลกเวร</button>
        <button class="btn btn-danger-outline" id="btnCancelOffer">ยกเลิก</button>`;
    }else{
      bodyHtml += `<p style="font-size:12.5px; color:var(--ink-faint);">รอเจ้าของเวรอีกฝั่งกดยืนยัน</p>`;
    }
  }else if(shift.swapStatus === 'confirmed'){
    bodyHtml += `<p style="font-size:13px; color:var(--green);">✅ แลก/ขายเวรสำเร็จแล้ว (เดิม: ${shift.originalName})</p>`;
  }

  box.innerHTML = `<h3>จัดการเวรนี้</h3>${bodyHtml}<div class="modal-actions">${actionsHtml}<button class="btn btn-outline" id="btnCloseAction">ปิด</button></div>`;
  document.getElementById('actionOverlay').classList.add('active');
  document.getElementById('btnCloseAction').addEventListener('click', closeActionModal);

  const offerSwapBtn = document.getElementById('btnOfferSwap');
  if(offerSwapBtn) offerSwapBtn.addEventListener('click', ()=> doOffer(date, slotType, 'swap'));
  const offerSellBtn = document.getElementById('btnOfferSell');
  if(offerSellBtn) offerSellBtn.addEventListener('click', ()=> doOffer(date, slotType, 'sell'));
  const cancelBtn = document.getElementById('btnCancelOffer');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=> doCancelSwap(date, slotType));
  const acceptSellBtn = document.getElementById('btnAcceptSell');
  if(acceptSellBtn) acceptSellBtn.addEventListener('click', ()=> doAcceptSell(date, slotType));
  const confirmBtn = document.getElementById('btnConfirmSwap');
  if(confirmBtn) confirmBtn.addEventListener('click', ()=> doConfirmSwap(date, slotType));
  box.querySelectorAll('.btn-match').forEach(b=>{
    b.addEventListener('click', ()=> doMatchSwap(b.dataset.srcDate, b.dataset.srcSlot, date, slotType));
  });
}

async function doOffer(date, slotType, offerType){
  const auth = window.PHQAuth.getAuth();
  const res = await apiCall('offerShift', {date, slotType, code:auth.code, offerType});
  if(!res.ok){ alert('ไม่สำเร็จ: '+res.error); return; }
  closeActionModal();
  await loadMonthAndRender();
}
async function doCancelSwap(date, slotType){
  const auth = window.PHQAuth.getAuth();
  const res = await apiCall('cancelSwap', {date, slotType, code:auth.code});
  if(!res.ok){ alert('ไม่สำเร็จ: '+res.error); return; }
  closeActionModal();
  await loadMonthAndRender();
}
async function doAcceptSell(date, slotType){
  const auth = window.PHQAuth.getAuth();
  if(!confirm('ยืนยันรับซื้อเวรนี้?')) return;
  const res = await apiCall('acceptSell', {date, slotType, buyerCode:auth.code});
  if(!res.ok){ alert('ไม่สำเร็จ: '+res.error); return; }
  closeActionModal();
  await loadMonthAndRender();
}
async function doConfirmSwap(date, slotType){
  if(!confirm('ยืนยันแลกเวรนี้? หลังยืนยันจะเปลี่ยนชื่อผู้ปฏิบัติงานทันที')) return;
  const auth = window.PHQAuth.getAuth();
  const res = await apiCall('confirmSwap', {date, slotType, code:auth.code});
  if(!res.ok){ alert('ไม่สำเร็จ: '+res.error); return; }
  closeActionModal();
  await loadMonthAndRender();
}
async function doMatchSwap(sourceDate, sourceSlotType, targetDate, targetSlotType){
  const auth = window.PHQAuth.getAuth();
  const res = await apiCall('matchSwap', {sourceDate, sourceSlotType, targetDate, targetSlotType, code:auth.code});
  if(!res.ok){ alert('ไม่สำเร็จ: '+res.error); return; }
  closeActionModal();
  await loadMonthAndRender();
}

// ---------- Modal: แก้ไขเวรวันนี้ (เฉพาะผู้จัดเวร) ----------
function openDayEditModal(date){
  const dayInfo = dayInfoFor(date);
  if(!dayInfo) return;
  const pharmacists = staffList.filter(s=>s.position==='pharmacist');
  const technicians = staffList.filter(s=>s.position==='technician');
  let slotsHtml = '';
  if(dayInfo.isHoliday){
    const mp = shiftFor(date,'morning-pharmacist');
    const mt = shiftFor(date,'morning-technician');
    slotsHtml += slotSelectHtml(date,'morning-pharmacist','เช้า (เภสัชกร)', pharmacists, mp?mp.actualCode:'');
    slotsHtml += slotSelectHtml(date,'morning-technician','เช้า (จนท.)', technicians, mt?mt.actualCode:'');
  }
  const et = shiftFor(date,'evening-technician');
  slotsHtml += slotSelectHtml(date,'evening-technician','บ่าย (จนท.)', technicians, et?et.actualCode:'');

  const box = document.getElementById('dayEditModalBox');
  box.innerHTML = `
    <h3>แก้ไขเวรวันที่ ${date}</h3>
    <div style="display:flex; flex-direction:column; gap:14px;">${slotsHtml}</div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="btnSaveDayEdit">บันทึก</button>
      <button class="btn btn-outline" id="btnCloseDayEdit">ยกเลิก</button>
    </div>`;
  document.getElementById('dayEditOverlay').classList.add('active');
  document.getElementById('btnCloseDayEdit').addEventListener('click', closeDayEditModal);
  document.getElementById('btnSaveDayEdit').addEventListener('click', async ()=>{
    const btn = document.getElementById('btnSaveDayEdit');
    btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
    const selects = box.querySelectorAll('select');
    try{
      for(const sel of selects){
        const d = sel.dataset.date, st = sel.dataset.slot, code = sel.value;
        if(code) await apiCall('saveShift', {date:d, slotType:st, code});
        else await apiCall('deleteShift', {date:d, slotType:st});
      }
      closeDayEditModal();
      await loadMonthAndRender();
    }catch(e){
      alert('บันทึกไม่สำเร็จ: '+e.message);
      btn.disabled = false; btn.textContent = 'บันทึก';
    }
  });
}

// ---------- แท็บ: รายงานเบิกค่าเวร ----------
function dropdownOptionsHtml(presets, currentValue, allowOther){
  const isKnown = presets.includes(currentValue);
  let html = '<option value="">— เลือก —</option>';
  html += presets.map(p=>`<option value="${p}" ${p===currentValue?'selected':''}>${p}</option>`).join('');
  if(allowOther) html += `<option value="__other__" ${(currentValue && !isKnown)?'selected':''}>อื่นๆ (พิมพ์เอง)</option>`;
  return html;
}

    [settings, status] = await Promise.all([
      apiCall('getSettings'),

    wrap.innerHTML = `<div class="card"><div class="no-access" style="color:var(--red);">⚠️ โหลดข้อมูลไม่สำเร็จ: ${e.message}</div></div>`;

             <button class="btn btn-primary" id="btnConfirmMonth">ยืนยันการขึ้นเวรเดือน ${monthLabel()}</button>`
          : `<p style="font-size:13px; color:var(--red); background:var(--red-tint); padding:10px 14px; border-radius:9px;">⚠️ ยังมีเวร ${status.pendingCount} รายการที่รอแลก/รอยืนยันอยู่ ต้องจัดการให้เสร็จก่อนยืนยันเดือนนี้ (ไปที่แท็บ "ปฏิทินเวร")</p>`}

    <div class="card" style="${status.confirmed?'':'opacity:.5; pointer-events:none;'}">
      <h2>ดาวน์โหลดรายงาน</h2>
      <p style="font-size:12.5px; color:var(--ink-soft); margin-top:0;">${status.confirmed?'':'ต้องยืนยันการขึ้นเวรเดือนนี้ก่อน จึงจะดาวน์โหลดรายงานได้'}</p>
      <div style="display:flex; flex-wrap:wrap; gap:10px;">
        <button class="btn btn-outline" id="btnDlSchedule">📅 ตารางเวร-${monthLabel()}.xlsx</button>
        <button class="btn btn-outline" id="btnDlWithdrawal">💰 หลักฐานตั้งเบิก-${monthLabel()}.xlsx</button>
        <button class="btn btn-outline" id="btnDlOT">📄 หนังสือขออนุมัติเบิก OT.docx</button>

    <div class="card">
      <h2>ตั้งค่าชื่อผู้ลงนาม (ใช้ในทุกรายงาน)</h2>
      <div class="field-row">
        <div class="field">
          <label>ชื่อหัวหน้ากลุ่มงาน</label>

          </select>
          <input type="text" id="setHeadNameOther" value="${!['นางสาวมัทนา สมบัติวัฒนาเวศ',''].includes(s.headName||'')?(s.headName||''):''}" placeholder="พิมพ์ชื่อเอง" style="margin-top:6px; display:${(s.headName && s.headName!=='นางสาวมัทนา สมบัติวัฒนาเวศ')?'':'none'};">
        </div>
        <div class="field">
          <label>ตำแหน่งหัวหน้ากลุ่มงาน</label>

      </div>
      <div class="field-row">

          <label>ชื่อผู้จ่ายเงิน</label>

        <div class="field">

            ${dropdownOptionsHtml(['เจ้าพนักงานธุรการชำนาญงาน'], s.payerPosition, true)}
          </select>
          <input type="text" id="setPayerPositionOther" value="${!['เจ้าพนักงานธุรการชำนาญงาน',''].includes(s.payerPosition||'')?(s.payerPosition||''):''}" placeholder="พิมพ์ตำแหน่งเอง" style="margin-top:6px; display:${(s.payerPosition && s.payerPosition!=='เจ้าพนักงานธุรการชำนาญงาน')?'':'none'};">
        </div>
      </div>

  if(confirmBtn) confirmBtn.addEventListener('click', async ()=>{
    if(!confirm(`ยืนยันการขึ้นเวรเดือน ${monthLabel()}?\nหลังยืนยันแล้ว จะสามารถดาวน์โหลดรายงานเบิกค่าเวรได้`)) return;
    const auth = window.PHQAuth.getAuth();
    confirmBtn.disabled = true; confirmBtn.textContent = 'กำลังยืนยัน...';

  document.getElementById('btnDlWithdrawal').addEventListener('click', ()=> downloadReport('generateWithdrawalReport', {}));
  document.getElementById('btnDlOT').addEventListener('click', ()=> downloadReport('generateOTLetter', {}));

  wrap.querySelectorAll('.dropdown-other-select').forEach(sel=>{

  function resolveDropdownValue(selectId, otherId){
    const sel = document.getElementById(selectId);
    if(sel.value === '__other__') return document.getElementById(otherId).value;
    return sel.value;
  }

  document.getElementById('btnSaveSettings').addEventListener('click', async ()=>{
    const payload = {
      headName: resolveDropdownValue('setHeadName','setHeadNameOther'),

      payerPosition: resolveDropdownValue('setPayerPosition','setPayerPositionOther'),

  });

async function downloadReport(action, extra){
  try{
    const res = await apiCall(action, Object.assign({year:curYear, month:curMonth}, extra));
    if(!res.ok) throw new Error(res.error||'unknown');
    const bytes = atob(res.base64);
    const arr = new Uint8Array(bytes.length);
    for(let i=0;i<bytes.length;i++) arr[i] = bytes.charCodeAt(i);
    const mime = res.filename.endsWith('.docx')
      ? 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
      : 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    const blob = new Blob([arr], {type:mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = res.filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(e){
    alert('สร้างไฟล์ไม่สำเร็จ: '+e.message);
  }
}

async function initApp(){
  const auth = window.PHQAuth.getAuth();
  if(!auth) return;
  try{
    const perm = await apiCall('checkPermission', {code:auth.code});
    canManage = !!(perm.ok && perm.valid && perm.canManage);
    myPosition = perm.position || '';
  }catch(e){ canManage = false; }
  try{
    const staffRes = await apiCall('getStaffList');
    staffList = staffRes.staff || [];
  }catch(e){ staffList = []; }
  if(!canManage){
    document.querySelectorAll('.tab-btn').forEach(b=>{
      if(b.dataset.tab==='calendar'){ b.classList.add('active'); }
      else b.classList.remove('active');
    });
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.getElementById('panel-calendar').classList.add('active');
  }
  await loadMonthAndRender();
}
initApp();
document.addEventListener('phq-auth-success', initApp);
