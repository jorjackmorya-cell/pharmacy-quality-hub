<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบจัดการยากล่อง Emergency Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F6F1; --card:#FFFFFF; --ink:#1E2A22; --ink-soft:#5B6B60; --ink-faint:#93A398; --line:#DDE3D8;
    --accent:#B5341D; --accent-tint:#FBEAE6;
    --amber:#BA7517; --amber-tint:#FAEEDA;
    --red:#A32D2D; --red-tint:#FCEBEB;
    --green:#3B6D11; --green-tint:#EAF3DE;
    --gray-tint:#EDEDE8; --gray-ink:#5F5E5A;
    --radius:14px; --shadow:0 1px 2px rgba(30,42,34,.06), 0 4px 16px rgba(30,42,34,.05);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Sarabun','Inter',sans-serif; -webkit-font-smoothing:antialiased;}
  .app{max-width:1080px; margin:0 auto; padding:0 20px 80px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:14px; padding-top:14px;}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{width:44px; height:44px; border-radius:12px; background:var(--accent); display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;}
  .brand-mark svg{width:22px; height:22px;}
  .brand h1{font-size:19px; font-weight:600; margin:0; line-height:1.3;}
  .brand p{margin:0; font-size:13px; color:var(--ink-soft);}
  .icon{width:16px; height:16px; vertical-align:-3px; flex-shrink:0;}

  .tabs{display:flex; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px; width:fit-content; margin-bottom:20px; flex-wrap:wrap;}
  .tab-btn{border:none; background:transparent; padding:9px 16px; border-radius:999px; font-size:14px; font-family:inherit; font-weight:500; color:var(--ink-soft); cursor:pointer; transition:.15s;}
  .tab-btn.active{background:var(--accent); color:#fff;}
  .panel{display:none;}
  .panel.active{display:block;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px; margin-bottom:20px;}
  .card h2{font-size:16px; margin:0 0 18px;}

  .box-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:16px;}
  .box-card{border-radius:var(--radius); padding:18px 20px; border:1px solid var(--line); overflow:hidden;}
  .box-card .card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:3px;}
  .box-card .name{font-weight:700; font-size:15.5px; margin:0; line-height:1.3;}
  .box-card .loc{font-size:12.5px; color:var(--ink-soft); margin:0 0 14px;}
  .box-card .expiry-label{font-size:11px; color:var(--ink-faint); margin-bottom:2px;}
  .box-card .expiry-date{font-size:19px; font-weight:700;}
  .box-card .expiry-drug{font-size:12px; margin-top:2px;}
  .box-card .badge{flex-shrink:0; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap;}
  .risk-ok{background:var(--green-tint);}
  .risk-ok .expiry-date{color:var(--green);}
  .risk-ok .badge{background:var(--green-tint); color:var(--green);}
  .risk-warning{background:var(--amber-tint);}
  .risk-warning .expiry-date{color:var(--amber);}
  .risk-warning .badge{background:var(--amber); color:#fff;}
  .risk-urgent{background:#FCE4D6;}
  .risk-urgent .expiry-date{color:#C1521A;}
  .risk-urgent .badge{background:#C1521A; color:#fff;}
  .risk-expired{background:#7A1616; color:#fff;}
  .risk-expired .loc, .risk-expired .expiry-label, .risk-expired .expiry-drug{color:#F3C9C9;}
  .risk-expired .expiry-date{color:#fff;}
  .risk-expired .badge{background:#fff; color:#7A1616;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; font-weight:500; color:var(--ink-soft); margin-bottom:6px;}
  .field select, .field input{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:9px; font-family:inherit; font-size:14px; background:#fff; color:var(--ink);}
  .field-row{display:flex; gap:12px; flex-wrap:wrap;}
  .field-row .field{flex:1; min-width:160px;}

  table.items{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.items th{text-align:left; font-size:11.5px; color:var(--ink-faint); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--line);}
  table.items td{padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
  table.items input, table.items select{width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:7px; font-family:inherit; font-size:13px;}
  .row-warning td{background:var(--amber-tint);}
  .row-urgent td{background:#FCE4D6;}
  .row-expired td{background:#7A1616; color:#fff;}

  .btn{border:none; border-radius:10px; padding:10px 18px; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:hover{background:#8f2a17;}
  .btn-outline{background:#fff; border:1px solid var(--line); color:var(--ink-soft);}
  .btn-outline:hover{border-color:var(--accent); color:var(--accent);}
  .btn-danger-outline{background:#fff; border:1px solid var(--line); color:var(--red); padding:5px 10px; font-size:12px;}
  .btn-sm{padding:5px 10px; font-size:12px;}

  .empty{padding:30px 20px; text-align:center; color:var(--ink-faint); font-size:14px;}
  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink-soft); margin-bottom:16px;}
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block;}

  .box-card{cursor:pointer; transition:transform .12s, box-shadow .12s;}
  .box-card:hover{transform:translateY(-2px); box-shadow:0 4px 14px rgba(30,42,34,.12);}
  .drug-chip{display:inline-block; padding:2px 9px; border-radius:7px; font-weight:600; margin-top:2px;}
  .risk-expired .drug-chip{background:#E8792A; color:#fff;}
  .risk-urgent .drug-chip{background:#8C1F1F; color:#fff;}
  .risk-warning .drug-chip{background:#C1521A; color:#fff;}
  .risk-ok .drug-chip{background:#2C5209; color:#fff;}

  .modal-overlay{position:fixed; inset:0; background:rgba(20,26,20,.45); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .modal-box{background:#fff; border-radius:16px; padding:26px; max-width:560px; width:100%; max-height:85vh; overflow-y:auto; box-shadow:0 12px 40px rgba(0,0,0,.25);}
  .modal-box h3{margin:0 0 14px; font-size:17px;}
  .modal-close-row{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}
  .summary-line{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .summary-line b{text-align:right;}
</style>
</head>
<body>
<div style="padding:14px 20px 0; max-width:1080px; margin:0 auto;">
  <a href="../" style="display:inline-flex; align-items:center; gap:6px; font-family:'Sarabun',sans-serif; font-size:13px; font-weight:600; color:#3B4FA0; text-decoration:none;">← หน้ารวมเครื่องมือ</a>
</div>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20"/><rect width="20" height="20" x="2" y="2" rx="4"/></svg></div>
      <div><h1>ระบบจัดการยากล่อง Emergency Box</h1><p>ห้องยา · โรงพยาบาลเชียงม่วน</p></div>
    </div>
  </div>

  <div class="tabs" id="tabsWrap">
    <button class="tab-btn active" data-tab="dashboard">หน้าแรก</button>
    <button class="tab-btn" data-tab="edit">แก้ไขรายการยา</button>
    <button class="tab-btn" data-tab="refill">รายงานการเติมยา</button>
  </div>

  <div class="panel active" id="panel-dashboard"></div>
  <div class="panel" id="panel-edit"></div>
  <div class="panel" id="panel-refill"></div>

</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzHgfp3ajroq3dkVbBtG2YJgOlFEhNkTdmXemrhEpLwb-P3DjGX-N8cSWijCzMrvqC8/exec';

function apiCall(action, extra){
  return fetch(API_URL, { method:'POST', body: JSON.stringify(Object.assign({action}, extra||{})) }).then(r=>r.json());
}

let formulary = [];
let currentBoxId = null;
const STAFF_LIST = [
  {code:'555555', name:'โชติวัฒน์ แก้วกลางเมือง'},
  {code:'666666', name:'เกียรติคุณ อุ่นกันทะ'},
  {code:'777777', name:'ภัทรียาพร คำมาปัน'},
];
const UNIT_OPTIONS = ['capsule','chewable tablet','tablet','bottle','vial','ampule','bag','cartridge','jar','patch','tube','suppository','sachet'];

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab === 'dashboard') renderDashboard();
    if(btn.dataset.tab === 'edit') renderEditPanel();
    if(btn.dataset.tab === 'refill') renderRefillPanel();
  });
});

// ---------- แท็บ: หน้าแรก (Dashboard) ----------
async function renderDashboard(){
  const wrap = document.getElementById('panel-dashboard');
  wrap.innerHTML = '<div class="card"><div class="empty">กำลังโหลด...</div></div>';
  let res;
  try{ res = await apiCall('getDashboard'); }
  catch(e){ wrap.innerHTML = `<div class="card"><div class="empty" style="color:var(--red);">โหลดไม่สำเร็จ: ${e.message}</div></div>`; return; }
  if(!res.ok){ wrap.innerHTML = `<div class="card"><div class="empty" style="color:var(--red);">โหลดไม่สำเร็จ: ${res.error}</div></div>`; return; }

  const cardsHtml = res.boxes.length ? res.boxes.map(b=>{
    const riskLabel = {ok:'ปกติ', warning:'ใกล้หมดอายุ (≤3 เดือน)', urgent:'ใกล้หมดอายุมาก (≤30 วัน)', expired:'หมดอายุแล้ว'}[b.riskLevel] || '';
    return `
    <div class="box-card risk-${b.riskLevel}" onclick="openBoxDetail('${b.id}')">
      <div class="card-head">
        <p class="name">${b.name}</p>
        <span class="badge">${riskLabel}</span>
      </div>
      <p class="loc">${b.location || ''} · ${b.itemCount} รายการ</p>
      <div class="expiry-label">วันหมดอายุที่ใกล้ที่สุด</div>
      <div class="expiry-date">${b.earliestExpiry || '—'}</div>
      ${b.earliestExpiryDrug ? `<span class="drug-chip">${b.earliestExpiryDrug}</span>` : ''}
    </div>`;
  }).join('') : '<div class="empty">ยังไม่มีข้อมูลกล่องยา</div>';

  wrap.innerHTML = `
    <div class="card">
      <h2>ภาพรวมกล่องยาฉุกเฉินทั้งหมด</h2>
      <div class="legend">
        <span><span class="dot" style="background:var(--green);"></span>ปกติ</span>
        <span><span class="dot" style="background:var(--amber);"></span>ใกล้หมดอายุ (≤3 เดือน)</span>
        <span><span class="dot" style="background:#C1521A;"></span>ใกล้หมดอายุมาก (≤30 วัน)</span>
        <span><span class="dot" style="background:#7A1616;"></span>หมดอายุแล้ว</span>
      </div>
      <div class="box-grid">${cardsHtml}</div>
    </div>`;
}

// ---------- Modal helper (ใช้ร่วมกันหลายจุด) ----------
function showModal(innerHtml){
  const existing = document.getElementById('modalOverlay');
  if(existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modalOverlay';
  overlay.innerHTML = `<div class="modal-box">${innerHtml}</div>`;
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
}
function closeModal(){
  const el = document.getElementById('modalOverlay');
  if(el) el.remove();
}

// ---------- รายละเอียดกล่อง (คลิกจากการ์ดหน้าแรก) ----------
async function openBoxDetail(boxId){
  showModal('<div class="empty">กำลังโหลด...</div>');
  const [boxesRes, itemsRes] = await Promise.all([apiCall('getBoxes'), apiCall('getBoxItems', {boxId})]);
  if(!boxesRes.ok || !itemsRes.ok){ showModal('<div class="empty" style="color:var(--red);">โหลดไม่สำเร็จ</div>'); return; }
  const box = boxesRes.boxes.find(b=>b.id===boxId);
  const items = itemsRes.items.slice().sort((a,b)=> (a.expDate||'9999').localeCompare(b.expDate||'9999'));
  const earliestId = items.length ? items[0].id : null;

  const rowsHtml = items.length ? items.map(it=>`
    <tr style="${it.id===earliestId ? 'font-weight:700; text-decoration:underline; background:var(--amber-tint);' : ''}">
      <td style="padding:6px 8px; border-bottom:1px solid var(--line);">${it.drugName}</td>
      <td style="padding:6px 8px; border-bottom:1px solid var(--line); text-align:center;">${it.qty} ${it.unit||''}</td>
      <td style="padding:6px 8px; border-bottom:1px solid var(--line); text-align:center;">${it.expDate ? it.expDate.split('-').reverse().join('/') : '—'}</td>
    </tr>`).join('') : '<tr><td colspan="3" class="empty">ไม่มีรายการยา</td></tr>';

  showModal(`
    <h3>${box ? box.name : ''}</h3>
    <p style="color:var(--ink-soft); font-size:13px; margin-top:-8px;">${box ? box.location : ''} — เรียงตามวันหมดอายุใกล้สุดก่อน (แถวไฮไลท์ = ใกล้หมดอายุที่สุด)</p>
    <table style="width:100%; border-collapse:collapse; font-size:13.5px;">
      <thead><tr><th style="text-align:left; padding:6px 8px; font-size:11.5px; color:var(--ink-faint);">รายการยา</th><th style="padding:6px 8px; font-size:11.5px; color:var(--ink-faint);">จำนวน</th><th style="padding:6px 8px; font-size:11.5px; color:var(--ink-faint);">วันหมดอายุ</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    <div class="modal-close-row">
      <button class="btn btn-outline" onclick="closeModal()">ปิด</button>
      <button class="btn btn-primary" onclick="closeModal(); jumpToEdit('${boxId}')">แก้ไขรายการยา</button>
    </div>`);
}

function jumpToEdit(boxId){
  currentBoxId = boxId;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelector('.tab-btn[data-tab="edit"]').classList.add('active');
  document.getElementById('panel-edit').classList.add('active');
  renderEditPanel();
}

// ---------- แท็บ: แก้ไขรายการยา ----------
let allBoxes = [];

function packedByOptionsHtml(currentName){
  const matched = STAFF_LIST.some(s => s.name === currentName);
  return STAFF_LIST.map(s=>`<option value="${s.name}" ${currentName===s.name?'selected':''}>${s.name}</option>`).join('')
    + `<option value="__other__" ${!matched && currentName ? 'selected':''}>อื่นๆ (พิมพ์เอง)</option>`;
}

function renderBoxInfoFields(box){
  const matched = STAFF_LIST.some(s => s.name === box.packedBy);
  const today = new Date().toISOString().slice(0,10);
  return `
    <div class="field-row">
      <div class="field">
        <label>ผู้บรรจุ</label>
        <select id="packedBySelect">${packedByOptionsHtml(box.packedBy)}</select>
        <input id="packedByOther" placeholder="พิมพ์ชื่อผู้บรรจุ" style="margin-top:6px; ${matched || !box.packedBy ? 'display:none;' : ''}" value="${!matched ? (box.packedBy||'') : ''}">
      </div>
      <div class="field">
        <label>ว/ด/ป ที่บรรจุ</label>
        <input type="date" id="packedDateInput" value="${today}">
      </div>
      <div class="field">
        <label>ว/ด/ป ที่ส่งคืนห้องยา</label>
        <input type="text" id="returnDateDisplay" value="${fmtDateDisplaySafe(box.returnDate)}" disabled style="background:#F5F6F1;">
      </div>
    </div>`;
}

function fmtDateDisplaySafe(v){
  if(!v) return 'ยังไม่คำนวณ';
  const d = new Date(v);
  if(isNaN(d.getTime())) return String(v);
  let y = d.getFullYear();
  if(y > 2400) y -= 543; // กันบั๊กปี พ.ศ./ค.ศ. จากข้อมูลเก่า
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return `${dd}/${mm}/${y}`;
}

async function renderEditPanel(){
  const wrap = document.getElementById('panel-edit');
  wrap.innerHTML = '<div class="card"><div class="empty">กำลังโหลด...</div></div>';

  let boxesRes, formularyRes;
  try{
    [boxesRes, formularyRes] = await Promise.all([apiCall('getBoxes'), apiCall('getFormulary')]);
  }catch(e){
    wrap.innerHTML = `<div class="card"><div class="empty" style="color:var(--red);">โหลดไม่สำเร็จ: ${e.message}</div></div>`;
    return;
  }
  if(!boxesRes.ok || !formularyRes.ok){
    wrap.innerHTML = `<div class="card"><div class="empty" style="color:var(--red);">โหลดไม่สำเร็จ</div></div>`;
    return;
  }
  allBoxes = boxesRes.boxes;
  formulary = formularyRes.drugs;
  if(!currentBoxId && allBoxes.length) currentBoxId = allBoxes[0].id;
  const currentBox = allBoxes.find(b=>b.id===currentBoxId) || {};

  wrap.innerHTML = `
    <div class="card">
      <div class="field">
        <label>เลือกกล่อง</label>
        <select id="boxSelect">
          ${allBoxes.map(b=>`<option value="${b.id}" ${b.id===currentBoxId?'selected':''}>${b.code} — ${b.name}</option>`).join('')}
        </select>
      </div>
      <div style="display:flex; gap:10px; margin-bottom:16px;">
        <button class="btn btn-outline" id="btnExport">📄 เปิดเอกสารสำหรับปริ้น</button>
        <button class="btn btn-outline" id="btnAddDrug">+ เพิ่มรายการยา</button>
      </div>
      <div id="boxInfoFields">${renderBoxInfoFields(currentBox)}</div>
    </div>
    <div class="card">
      <h2>รายการยาในกล่อง</h2>
      <div id="itemsTableWrap"></div>
    </div>`;

  document.getElementById('boxSelect').addEventListener('change', (e)=>{
    currentBoxId = e.target.value;
    const box = allBoxes.find(b=>b.id===currentBoxId) || {};
    document.getElementById('boxInfoFields').innerHTML = renderBoxInfoFields(box);
    wirePackedBySelect();
    renderItemsTable();
  });
  document.getElementById('btnExport').addEventListener('click', doExport);
  document.getElementById('btnAddDrug').addEventListener('click', ()=> addBlankRow());
  wirePackedBySelect();

  await renderItemsTable();
}

function wirePackedBySelect(){
  const sel = document.getElementById('packedBySelect');
  const other = document.getElementById('packedByOther');
  if(!sel) return;
  sel.addEventListener('change', ()=>{
    other.style.display = sel.value === '__other__' ? 'block' : 'none';
  });
}

function getPackedByValue(){
  const sel = document.getElementById('packedBySelect');
  const other = document.getElementById('packedByOther');
  if(!sel) return '';
  return sel.value === '__other__' ? (other.value||'').trim() : sel.value;
}

async function renderItemsTable(){
  const tableWrap = document.getElementById('itemsTableWrap');
  tableWrap.innerHTML = '<div class="empty">กำลังโหลด...</div>';
  const res = await apiCall('getBoxItems', {boxId: currentBoxId});
  if(!res.ok){ tableWrap.innerHTML = `<div class="empty" style="color:var(--red);">โหลดไม่สำเร็จ</div>`; return; }
  renderTableRows(res.items);
}

function riskRowClass(expDate){
  if(!expDate) return '';
  const d = new Date(expDate); d.setHours(0,0,0,0);
  const today = new Date(); today.setHours(0,0,0,0);
  const diffDays = Math.floor((d - today) / 86400000);
  if(diffDays < 0) return 'row-expired';
  if(diffDays <= 30) return 'row-urgent';
  if(diffDays <= 90) return 'row-warning';
  return '';
}

function drugOptionsHtml(selectedCode){
  const opts = ['<option value="">— พิมพ์ค้นหา/เลือกยา —</option>'];
  formulary.forEach(d=>{
    opts.push(`<option value="${d.code}" ${d.code===selectedCode?'selected':''}>${d.name}</option>`);
  });
  return opts.join('');
}

function renderTableRows(items){
  const tableWrap = document.getElementById('itemsTableWrap');
  if(!items.length){
    tableWrap.innerHTML = '<div class="empty">ยังไม่มีรายการยาในกล่องนี้ กด "+ เพิ่มรายการยา" เพื่อเริ่มต้น</div>';
    return;
  }
  tableWrap.innerHTML = `
    <table class="items">
      <thead><tr><th style="width:34%">รายการยา</th><th style="width:12%">จำนวน</th><th style="width:10%">หน่วย</th><th style="width:16%">วันหมดอายุ</th><th style="width:20%">หมายเหตุ</th><th></th></tr></thead>
      <tbody>
        ${items.map(it=>`
        <tr class="${riskRowClass(it.expDate)}" data-id="${it.id}">
          <td><input list="drugDatalist" class="f-name" value="${it.drugName}" data-code="${it.drugCode}"></td>
          <td><input class="f-qty" type="number" min="0" value="${it.qty}"></td>
          <td><input class="f-unit" list="unitDatalist" value="${it.unit}"></td>
          <td><input class="f-exp" type="date" value="${it.expDate}"></td>
          <td><input class="f-note" value="${it.note}"></td>
          <td><button class="btn-danger-outline btn-sm btn-del">ลบ</button></td>
        </tr>`).join('')}
      </tbody>
    </table>
    <datalist id="drugDatalist">
      ${formulary.map(d=>`<option value="${d.name}" data-code="${d.code}" data-unit="${d.unit}">`).join('')}
    </datalist>
    <datalist id="unitDatalist">
      ${UNIT_OPTIONS.map(u=>`<option value="${u}">`).join('')}
    </datalist>
    <div style="margin-top:16px;"><button class="btn btn-primary" id="btnSaveAll">บันทึกการเปลี่ยนแปลง</button> <span id="saveMsg" style="font-size:13px; color:var(--green); margin-left:8px;"></span></div>`;

  tableWrap.querySelectorAll('.btn-del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const tr = btn.closest('tr');
      const id = tr.dataset.id;
      if(!confirm('ยืนยันลบรายการยานี้?')) return;
      if(id && id !== 'new'){ await apiCall('deleteItem', {id}); }
      tr.remove();
    });
  });

  document.getElementById('btnSaveAll').addEventListener('click', saveAllRows);
}

function addBlankRow(){
  const tbody = document.querySelector('#itemsTableWrap table.items tbody');
  if(!tbody){
    renderTableRows([{id:'new', drugName:'', drugCode:'', qty:'', unit:'', expDate:'', note:''}]);
    return;
  }
  const tr = document.createElement('tr');
  tr.dataset.id = 'new';
  tr.innerHTML = `
    <td><input list="drugDatalist" class="f-name" value="" data-code=""></td>
    <td><input class="f-qty" type="number" min="0" value=""></td>
    <td><input class="f-unit" list="unitDatalist" value=""></td>
    <td><input class="f-exp" type="date" value=""></td>
    <td><input class="f-note" value=""></td>
    <td><button class="btn-danger-outline btn-sm btn-del">ลบ</button></td>`;
  tbody.appendChild(tr);
  tr.querySelector('.btn-del').addEventListener('click', ()=>{ if(confirm('ยืนยันลบแถวนี้?')) tr.remove(); });
}

async function saveAllRows(){
  const rows = document.querySelectorAll('#itemsTableWrap table.items tbody tr');
  const msg = document.getElementById('saveMsg');
  msg.textContent = 'กำลังบันทึก...'; msg.style.color = 'var(--ink-soft)';
  let earliestExp = null, earliestName = '';
  try{
    for(const tr of rows){
      const name = tr.querySelector('.f-name').value.trim();
      if(!name) continue;
      const nameInput = tr.querySelector('.f-name');
      // หา drugCode จาก datalist ถ้าเลือกตรงชื่อ
      let code = nameInput.dataset.code || '';
      const opt = document.querySelector(`#drugDatalist option[value="${CSS.escape(name)}"]`);
      if(opt) code = opt.dataset.code;
      const expVal = tr.querySelector('.f-exp').value;
      const payload = {
        id: tr.dataset.id === 'new' ? undefined : tr.dataset.id,
        boxId: currentBoxId,
        drugCode: code,
        drugName: name,
        qty: tr.querySelector('.f-qty').value,
        unit: tr.querySelector('.f-unit').value,
        expDate: expVal,
        note: tr.querySelector('.f-note').value,
      };
      await apiCall('saveItem', payload);
      if(expVal && (!earliestExp || expVal < earliestExp)){ earliestExp = expVal; earliestName = name; }
    }

    // คำนวณ ว/ด/ป ที่ส่งคืนห้องยา = 3 เดือนก่อนยาที่หมดอายุเร็วที่สุด
    let returnDateIso = '';
    if(earliestExp){
      const d = new Date(earliestExp + 'T00:00:00');
      d.setMonth(d.getMonth() - 3);
      returnDateIso = d.toISOString().slice(0,10);
    }
    const packedBy = getPackedByValue();
    const packedDate = document.getElementById('packedDateInput').value;
    await apiCall('updateBox', { id: currentBoxId, packedBy, packedDate, returnDate: returnDateIso });

    msg.textContent = 'บันทึกแล้ว ✓'; msg.style.color = 'var(--green)';
    await renderItemsTable();
    document.getElementById('returnDateDisplay').value = fmtDateDisplaySafe(returnDateIso);

    const boxName = (allBoxes.find(b=>b.id===currentBoxId)||{}).name || '';
    showModal(`
      <h3>บันทึกข้อมูลกล่องเรียบร้อย</h3>
      <div class="summary-line"><span>กล่อง</span><b>${boxName}</b></div>
      <div class="summary-line"><span>ยาที่อายุสั้นที่สุด</span><b>${earliestName || '—'}${earliestExp ? ' ('+fmtDateDisplaySafe(earliestExp)+')' : ''}</b></div>
      <div class="summary-line"><span>ผู้บรรจุ</span><b>${packedBy || '—'}</b></div>
      <div class="summary-line"><span>ว/ด/ป ที่บรรจุ</span><b>${packedDate ? fmtDateDisplaySafe(packedDate) : '—'}</b></div>
      <div class="summary-line"><span>ว/ด/ป ที่ส่งคืนห้องยา</span><b>${returnDateIso ? fmtDateDisplaySafe(returnDateIso) : '—'}</b></div>
      <div class="modal-close-row"><button class="btn btn-primary" onclick="closeModal()">ตกลง</button></div>`);
  }catch(e){
    msg.textContent = 'บันทึกไม่สำเร็จ: ' + e.message; msg.style.color = 'var(--red)';
  }
}

async function doExport(){
  const btn = document.getElementById('btnExport');
  btn.disabled = true; btn.textContent = 'กำลังสร้างเอกสาร...';
  // เปิดแท็บเปล่าทันทีตอนคลิก (ก่อน await ใดๆ) เพราะเบราว์เซอร์จะบล็อกป๊อปอัปถ้าเปิดหลังรอ network response
  const newTab = window.open('', '_blank');
  if(newTab) newTab.document.write('<p style="font-family:sans-serif; padding:20px;">กำลังสร้างเอกสาร กรุณารอสักครู่...</p>');
  try{
    const res = await apiCall('exportBoxDocx', {boxId: currentBoxId});
    if(!res.ok) throw new Error(res.error || 'unknown');
    if(newTab && !newTab.closed) newTab.location.href = res.url;
    else window.open(res.url, '_blank'); // เผื่อกรณีแท็บเปล่าถูกปิดไปก่อน
  }catch(e){
    if(newTab && !newTab.closed) newTab.close();
    alert('สร้างเอกสารไม่สำเร็จ: ' + e.message);
  }
  btn.disabled = false; btn.textContent = '📄 เปิดเอกสารสำหรับปริ้น';
}

// ---------- แท็บ: รายงานการเติมยา ----------
async function renderRefillPanel(){
  const wrap = document.getElementById('panel-refill');
  const today = new Date().toISOString().slice(0,10);
  const monthAgo = new Date(Date.now() - 30*86400000).toISOString().slice(0,10);
  wrap.innerHTML = `
    <div class="card">
      <div class="field-row">
        <div class="field"><label>ตั้งแต่วันที่</label><input type="date" id="rfFrom" value="${monthAgo}"></div>
        <div class="field"><label>ถึงวันที่</label><input type="date" id="rfTo" value="${today}"></div>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-primary" id="btnRfLoad">แสดงรายงาน</button>
        <button class="btn btn-outline" id="btnRfExport">⬇️ ดาวน์โหลด CSV (รายการดิบ)</button>
      </div>
    </div>
    <div class="card"><h2>1. จำนวนการเติมยารวมต่อรายการ</h2><div id="rfQtyByDrug"><div class="empty">เลือกช่วงวันที่แล้วกด "แสดงรายงาน"</div></div></div>
    <div class="card"><h2>2. ความทันเวลาก่อนยาหมดอายุ</h2><div id="rfTimeliness"></div></div>
    <div class="card"><h2>3. กล่องยาที่มียาใกล้หมดอายุในช่วงที่เลือก</h2><div id="rfNearExpiry"></div></div>
    <div class="card"><h2>4. รายการยาที่ถูกเติม/แก้ไขบ่อยที่สุด</h2><div id="rfMostFrequent"></div></div>
    <div class="card"><h2>5. รายงานผู้บรรจุ (สถานะปัจจุบันแต่ละกล่อง)</h2><div id="rfPacker"></div></div>
    <div class="card"><h2>รายการดิบ (log ทั้งหมด)</h2><div id="rfTableWrap"></div></div>`;

  document.getElementById('btnRfLoad').addEventListener('click', loadRefillTable);
  document.getElementById('btnRfExport').addEventListener('click', exportRefillCsv);
}

function emptyOr(rows, html){ return rows && rows.length ? html : '<div class="empty">ไม่มีข้อมูลในช่วงนี้</div>'; }

async function loadRefillTable(){
  const dateFrom = document.getElementById('rfFrom').value;
  const dateTo = document.getElementById('rfTo').value;
  ['rfQtyByDrug','rfTimeliness','rfNearExpiry','rfMostFrequent','rfPacker','rfTableWrap'].forEach(id=>{
    document.getElementById(id).innerHTML = '<div class="empty">กำลังโหลด...</div>';
  });

  const [logRes, bundleRes] = await Promise.all([
    apiCall('getRefillLog', {dateFrom, dateTo}),
    apiCall('getRefillReportBundle', {dateFrom, dateTo}),
  ]);
  if(!logRes.ok || !bundleRes.ok){
    const err = (!logRes.ok ? logRes.error : bundleRes.error) || 'unknown';
    ['rfQtyByDrug','rfTimeliness','rfNearExpiry','rfMostFrequent','rfPacker','rfTableWrap'].forEach(id=>{
      document.getElementById(id).innerHTML = `<div class="empty" style="color:var(--red);">${err}</div>`;
    });
    return;
  }

  // 1) จำนวนการเติมยารวมต่อรายการ
  document.getElementById('rfQtyByDrug').innerHTML = emptyOr(bundleRes.refillQtyByDrug, `
    <table class="items"><thead><tr><th>รายการยา</th><th>จำนวนที่เติมรวม</th><th>จำนวนครั้ง</th></tr></thead>
    <tbody>${bundleRes.refillQtyByDrug.map(r=>`<tr><td>${r.drugName}</td><td style="text-align:center; font-weight:600;">+${r.totalQty}</td><td style="text-align:center;">${r.count}</td></tr>`).join('')}</tbody></table>`);

  // 2) ความทันเวลา
  document.getElementById('rfTimeliness').innerHTML = emptyOr(bundleRes.timeliness, `
    <table class="items"><thead><tr><th>วันที่เติม</th><th>กล่อง</th><th>รายการยา</th><th>วันหมดอายุ</th><th>สถานะ</th></tr></thead>
    <tbody>${bundleRes.timeliness.map(r=>{
      const color = r.status.includes('หลังยาหมดอายุ') ? 'var(--red)' : r.status.includes('ใกล้') ? 'var(--amber)' : 'var(--green)';
      return `<tr><td>${new Date(r.timestamp).toLocaleDateString('th-TH')}</td><td>${r.boxCode}</td><td>${r.drugName}</td><td>${r.expDate||'—'}</td><td style="color:${color}; font-weight:600;">${r.status}</td></tr>`;
    }).join('')}</tbody></table>`);

  // 3) กล่องใกล้หมดอายุในช่วงที่เลือก
  document.getElementById('rfNearExpiry').innerHTML = emptyOr(bundleRes.nearExpiryBoxes, `
    <table class="items"><thead><tr><th>กล่อง</th><th>รายการยา</th><th>วันหมดอายุ</th></tr></thead>
    <tbody>${bundleRes.nearExpiryBoxes.map(r=>`<tr><td>${r.boxCode} — ${r.boxName}</td><td>${r.drugName}</td><td>${r.expDate}</td></tr>`).join('')}</tbody></table>`);

  // 4) ยาที่เติม/แก้ไขบ่อยที่สุด
  document.getElementById('rfMostFrequent').innerHTML = emptyOr(bundleRes.mostFrequentDrugs, `
    <table class="items"><thead><tr><th>รายการยา</th><th>จำนวนครั้งที่ถูกแก้ไข</th></tr></thead>
    <tbody>${bundleRes.mostFrequentDrugs.map(r=>`<tr><td>${r.drugName}</td><td style="text-align:center; font-weight:600;">${r.changeCount}</td></tr>`).join('')}</tbody></table>`);

  // 5) รายงานผู้บรรจุ
  document.getElementById('rfPacker').innerHTML = emptyOr(bundleRes.packerSummary, `
    <table class="items"><thead><tr><th>กล่อง</th><th>ผู้บรรจุ</th><th>ว/ด/ป ที่บรรจุ</th><th>ว/ด/ป ที่ส่งคืน</th></tr></thead>
    <tbody>${bundleRes.packerSummary.map(r=>`<tr><td>${r.boxCode} — ${r.boxName}</td><td>${r.packedBy||'—'}</td><td>${r.packedDate||'—'}</td><td>${r.returnDate||'—'}</td></tr>`).join('')}</tbody></table>`);

  // รายการดิบ
  document.getElementById('rfTableWrap').innerHTML = emptyOr(logRes.entries, `
    <table class="items">
      <thead><tr><th>วันที่-เวลา</th><th>กล่อง</th><th>รายการยา</th><th>ก่อน</th><th>หลัง</th><th>ส่วนต่าง</th></tr></thead>
      <tbody>
        ${logRes.entries.map(e=>`<tr>
          <td>${new Date(e.timestamp).toLocaleString('th-TH')}</td>
          <td>${e.boxCode}</td>
          <td>${e.drugName}</td>
          <td>${e.qtyBefore}</td>
          <td>${e.qtyAfter}</td>
          <td style="color:${e.delta>=0?'var(--green)':'var(--red)'}; font-weight:600;">${e.delta>0?'+':''}${e.delta}</td>
        </tr>`).join('')}
      </tbody>
    </table>`);
}

async function exportRefillCsv(){
  const dateFrom = document.getElementById('rfFrom').value;
  const dateTo = document.getElementById('rfTo').value;
  const btn = document.getElementById('btnRfExport');
  btn.disabled = true; btn.textContent = 'กำลังสร้างไฟล์...';
  try{
    const res = await apiCall('exportRefillReport', {dateFrom, dateTo});
    if(!res.ok) throw new Error(res.error || 'unknown');
    const bytes = atob(res.base64);
    const arr = new Uint8Array(bytes.length);
    for(let i=0;i<bytes.length;i++) arr[i] = bytes.charCodeAt(i);
    const blob = new Blob([arr], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = res.filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(e){
    alert('สร้างไฟล์ไม่สำเร็จ: ' + e.message);
  }
  btn.disabled = false; btn.textContent = '⬇️ ดาวน์โหลด CSV';
}

renderDashboard();
